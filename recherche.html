  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/holding-local.css" />
  <style>
    .sbox{max-width:760px;margin:26px auto 0;display:flex;gap:10px}
    .sbox input{flex:1;min-width:0;padding:16px 18px;border:1.5px solid var(--line2);border-radius:999px;font:16px var(--sans);background:#fff}
    .sbox input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
    .res{max-width:760px;margin:30px auto 0;display:grid;gap:12px}
    .r{display:block;background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:18px 20px;transition:border-color .2s,transform .2s}
    .r:hover{border-color:var(--acc);transform:translateY(-2px)}
    .r .k{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--acc)}
    .r h2{font-size:19px;font-weight:600;margin-top:6px;font-family:var(--serif)}.r p{font-size:14.5px;color:var(--secondary);margin-top:6px}
    .r .u{font-size:12px;color:var(--muted);margin-top:6px;word-break:break-all}
    .empty{text-align:center;color:var(--secondary)}
  </style>
</head>
<body>
<header class="nav"><div class="wrap navin"><a class="brand" href="index.html" aria-label="Groupe Solution — accueil"><img src="Logo.svg" alt="Groupe Solution" /></a><nav class="links"><a href="automatisation/">Automatisation</a><a href="montpellier/site-internet-montpellier.html">Sites internet</a><a href="lab/">Lab</a><a href="plan-du-site.html">Plan du site</a><a class="cta" href="tel:+33782298559">07 82 29 85 59</a></nav></div></header>
<main>
  <section class="hero" style="padding-bottom:20px"><div class="wrap" style="text-align:center;max-width:820px">
    <div class="kicker">Recherche</div>
    <h1 style="margin-top:16px">Que cherchez-vous ?</h1>
    <form class="sbox" role="search" action="recherche.html"><input type="search" name="q" id="q" placeholder="Ex : agent vocal, restaurant, Sète, facturation électronique…" aria-label="Rechercher" autofocus /><button class="btn" type="submit">Chercher</button></form>
  </div></section>
  <section class="sec" style="padding-top:0"><div class="wrap"><div class="res" id="res" aria-live="polite"></div></div></section>
</main>
<footer><div class="wrap foot"><span class="footBrand"><img src="Logo.svg" alt="Groupe Solution" /> © <span id="year"></span> Groupe Solution</span><nav><a href="index.html">Accueil</a><a href="plan-du-site.html">Plan du site</a><a href="echanger.html">Échanger</a></nav></div></footer>
<script src="assets/holding-local.js" defer></script>
<script src="/analytics.js" defer></script>
<script>
(function () {
  var LAB = { site: 'Site internet', auto: 'Automatisation', metier: 'Métier', guide: 'Guide', veille: 'Veille', actus: 'Actus', outil: 'Outil gratuit', lab: 'Lab', zone: 'Territoire', groupe: 'Groupe Solution' };
  var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var input = document.getElementById('q'), out = document.getElementById('res');
  function run(q) {
    if (!q) { out.innerHTML = ''; return; }
    var go = function () {
      window.GSSearch(q, 60).then(function (rs) {
        var seen = {}, list = rs.filter(function (r) { if (seen[r.c.u]) return false; seen[r.c.u] = 1; return true; }).slice(0, 20);
        out.innerHTML = list.length ? list.map(function (r) {
          return '<a class="r" href="' + esc(r.c.u) + '"><span class="k">' + (LAB[r.c.k] || '') + '</span><h2>' + esc(r.c.t) + '</h2><p>' + esc(r.c.h ? r.c.h + ' — ' + r.c.x : r.c.x) + '</p><div class="u">groupsolution.fr' + esc(r.c.u) + '</div></a>';
        }).join('') : '<p class="empty">Aucun résultat. Essayez un autre mot, ou <a href="tel:+33782298559"><b>appelez le 07 82 29 85 59</b></a>.</p>';
      });
    };
    if (window.GSSearch) go(); else { var t = setInterval(function () { if (window.GSSearch) { clearInterval(t); go(); } }, 100); }
  }
  var q0 = new URLSearchParams(location.search).get('q') || '';
  input.value = q0; run(q0);
  var tm; input.addEventListener('input', function () { clearTimeout(tm); tm = setTimeout(function () { history.replaceState(null, '', '?q=' + encodeURIComponent(input.value)); run(input.value.trim()); }, 250); });
})();
</script>
</body>
</html>
