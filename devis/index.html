<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Votre devis | Groupe Solution</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
:root{--ink:#171613;--sec:#57534B;--muted:#8A857B;--line:#E7E4DC;--paper:#F7F6F3;--acc:#E61E4D;--ok:#2F7D4F}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,"Segoe UI",Roboto,"Plus Jakarta Sans",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.top img{height:34px}.top a{color:var(--ink);font-weight:700;text-decoration:none;font-size:14px}
.doc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 22px;box-shadow:0 10px 30px rgba(23,22,19,.06)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding-bottom:18px}
.head h1{font:600 26px/1.15 Georgia,"Source Serif 4",serif;margin:0 0 4px}.num{color:var(--muted);font-size:13.5px}
.badge{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:#FDECEF;color:var(--acc)}.badge.ok{background:#E7F3EC;color:var(--ok)}.badge.off{background:#eee;color:#666}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0}.parties h3{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}.parties p{margin:0;white-space:pre-line;font-size:14px}
.objet{font-weight:800;font-size:17px;margin:6px 0}.intro{color:var(--sec);white-space:pre-line}
table{width:100%;border-collapse:collapse;margin:16px 0}th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);padding:8px 6px}
td{border-bottom:1px solid var(--line);padding:10px 6px;vertical-align:top;font-size:14px}td.r,th.r{text-align:right;white-space:nowrap}td small{display:block;color:var(--sec);white-space:pre-line;margin-top:2px}
.tot{margin-left:auto;max-width:320px}.tot div{display:flex;justify-content:space-between;padding:5px 0}.tot .ttc{font-weight:800;font-size:18px;border-top:2px solid var(--ink);margin-top:4px;padding-top:9px}
.cond{margin-top:18px;font-size:13px;color:var(--sec);white-space:pre-line}.legal{margin-top:12px;font-size:12px;color:var(--muted);white-space:pre-line}
.sign{margin-top:22px;border:2px solid var(--ink);border-radius:18px;padding:18px}.sign h2{margin:0 0 4px;font-size:19px}.sign p{margin:0 0 12px;color:var(--sec);font-size:14px}
.sign label{display:block;font-weight:700;font-size:13.5px;margin:12px 0 6px}.sign input[type=text]{width:100%;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.pad{position:relative;border:1px dashed #B9B4A8;border-radius:14px;background:#FCFBF8;touch-action:none}.pad canvas{display:block;width:100%;height:180px;border-radius:14px}.pad .ph{position:absolute;inset:0;display:grid;place-items:center;color:#B9B4A8;font-size:14px;pointer-events:none}
.clear{background:none;border:0;color:var(--sec);text-decoration:underline;font-size:13px;cursor:pointer;margin-top:6px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0 4px;font-size:14px}.chk input{width:20px;height:20px;accent-color:var(--acc);margin-top:1px;flex-shrink:0}
.btn{width:100%;margin-top:14px;min-height:54px;border:0;border-radius:999px;background:var(--acc);color:#fff;font-size:16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5}
.err{color:var(--acc);font-weight:700;font-size:14px;margin-top:10px}
.signed{margin-top:22px;border:2px solid var(--ok);border-radius:18px;padding:18px;background:#F4FAF6}.signed img{max-width:260px;width:100%;height:auto;display:block;margin:8px 0;background:#fff;border:1px solid var(--line);border-radius:10px}
.signed code{font-size:11px;word-break:break-all;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.acts a,.acts button{flex:1 1 180px;text-align:center;min-height:48px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;text-decoration:none;font-size:14.5px;cursor:pointer}
.msg{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center}
@media(max-width:640px){.doc{padding:20px 14px}.parties{grid-template-columns:1fr}.head h1{font-size:22px}th.hq,td.hq,th.hu,td.hu{display:none}td,th{padding:9px 4px}}
@media print{body{background:#fff}.top,.sign,.acts,.noprint{display:none!important}.doc{border:0;box-shadow:none;padding:0}.wrap{padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/"><img src="/Logo.svg" alt="Groupe Solution" width="120" height="34" /></a><a href="tel:+33782298559">📞 07 82 29 85 59</a></div>
  <div id="app"><div class="msg">Chargement de votre devis…</div></div>
</div>
<script>
(function () {
  var app = document.getElementById('app');
  var id = (new URLSearchParams(location.search).get('d') || '').toLowerCase();
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function eur(n) { return (Math.round((n || 0) * 100) / 100).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
  function fdate(s) { try { return new Date(s).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return s; } }
  function fnum(n) { return String(n).replace('.', ','); }
  if (!/^[a-f0-9]{32}$/.test(id)) { app.innerHTML = '<div class="msg">Ce lien de devis n’est pas valide. Vérifiez l’adresse reçue par e-mail, ou appelez le 07 82 29 85 59.</div>'; return; }
  fetch('/api/devis?id=' + id).then(function (r) { if (!r.ok) throw r.status; return r.json(); }).then(function (d) { render(d.devis); })
    .catch(function (s) { app.innerHTML = '<div class="msg">' + (s === 404 ? 'Ce devis est introuvable.' : 'Le devis n’a pas pu être chargé. Réessayez dans un instant.') + ' Besoin d’aide ? <a href="tel:+33782298559">07 82 29 85 59</a></div>'; });

  function render(v) {
    var e = v.emetteur || {}, c = v.client || {};
    var fin = new Date(new Date(v.date).getTime() + v.validite_jours * 86400e3);
    var badge = v.statut === 'signe' ? '<span class="badge ok">Signé</span>' : v.expire ? '<span class="badge off">Expiré</span>' : '<span class="badge">À signer</span>';
    var h = '<div class="doc"><div class="head"><div><h1>Devis</h1><div class="num">N° ' + esc(v.numero) + ' · émis le ' + fdate(v.date) + ' · valable jusqu’au ' + fdate(fin) + '</div></div><div>' + badge + '</div></div>' +
      '<div class="parties"><div><h3>Émetteur</h3><p><b>' + esc(e.raison_sociale || 'Groupe Solution') + '</b>\n' + esc([e.adresse, e.siret ? 'SIRET ' + e.siret : '', e.tva_intra ? 'TVA ' + e.tva_intra : '', e.rcs, e.telephone, e.email].filter(Boolean).join('\n')) + '</p></div>' +
      '<div><h3>Client</h3><p><b>' + esc(c.entreprise || c.nom) + '</b>\n' + esc([c.entreprise ? c.nom : '', c.adresse, c.email, c.telephone].filter(Boolean).join('\n')) + '</p></div></div>' +
      (v.objet ? '<p class="objet">' + esc(v.objet) + '</p>' : '') + (v.intro ? '<p class="intro">' + esc(v.intro) + '</p>' : '') +
      '<table><thead><tr><th>Désignation</th><th class="r hq">Qté</th><th class="r hu">P.U. HT</th><th class="r">Total HT</th></tr></thead><tbody>' +
      v.lignes.map(function (l) { return '<tr><td><b>' + esc(l.designation) + '</b>' + (l.detail ? '<small>' + esc(l.detail) + '</small>' : '') + '<small class="noq">' + fnum(l.quantite) + ' ' + esc(l.unite) + '</small></td><td class="r hq">' + fnum(l.quantite) + ' ' + esc(l.unite) + '</td><td class="r hu">' + eur(l.prix_ht) + '</td><td class="r">' + eur(l.total_ht) + '</td></tr>'; }).join('') +
      '</tbody></table><div class="tot"><div><span>Total HT</span><span>' + eur(v.totaux.ht) + '</span></div>' +
      (v.tva_taux ? '<div><span>TVA ' + fnum(v.tva_taux) + ' %</span><span>' + eur(v.totaux.tva) + '</span></div>' : '') +
      '<div class="ttc"><span>Total ' + (v.tva_taux ? 'TTC' : '') + '</span><span>' + eur(v.totaux.ttc) + '</span></div>' +
      (v.acompte_pct ? '<div><span>Acompte à la signature (' + fnum(v.acompte_pct) + ' %)</span><span>' + eur(v.totaux.acompte) + '</span></div>' : '') + '</div>' +
      (v.mention_tva ? '<p class="legal">' + esc(v.mention_tva) + '</p>' : '') + (v.conditions ? '<p class="cond"><b>Conditions</b>\n' + esc(v.conditions) + '</p>' : '') + (e.mentions ? '<p class="legal">' + esc(e.mentions) + '</p>' : '');
    if (v.signature) {
      h += '<div class="signed"><b>✅ Bon pour accord</b><br>Signé électroniquement par <b>' + esc(v.signature.nom) + '</b> le ' + new Date(v.signature.date).toLocaleString('fr-FR') + '.<img src="' + esc(v.signature.image) + '" alt="Signature de ' + esc(v.signature.nom) + '" /><code>Empreinte du document signé (SHA-256) : ' + esc(v.signature.empreinte) + '</code></div>';
    }
    h += '</div>';
    if (!v.signature && !v.expire) h += '<div class="sign" id="sign"><h2>Signer ce devis</h2><p>Signature électronique : votre nom, votre signature tracée au doigt ou à la souris, et la mention « Bon pour accord ». L’horodatage et l’empreinte du document sont enregistrés.</p>' +
      '<label for="sn">Nom et prénom du signataire</label><input type="text" id="sn" autocomplete="name" value="' + esc(c.nom) + '" />' +
      '<label>Votre signature</label><div class="pad"><canvas id="pad"></canvas><span class="ph" id="ph">Signez ici</span></div><button type="button" class="clear" id="clr">Effacer</button>' +
      '<label class="chk"><input type="checkbox" id="ok" /><span><b>Bon pour accord.</b> J’accepte ce devis n° ' + esc(v.numero) + ' d’un montant de ' + eur(v.totaux.ttc) + (v.tva_taux ? ' TTC' : '') + ' et ses conditions.</span></label>' +
      '<button class="btn" id="go">Signer le devis</button><div class="err" id="err" role="alert"></div></div>';
    if (v.expire && !v.signature) h += '<div class="msg noprint" style="margin-top:16px">Ce devis a dépassé sa durée de validité. Appelez Titouan au <a href="tel:+33782298559">07 82 29 85 59</a> pour le mettre à jour.</div>';
    h += '<div class="acts"><button type="button" onclick="print()">🖨️ Imprimer / PDF</button><a href="tel:+33782298559">📞 Une question ? Appeler Titouan</a></div>';
    app.innerHTML = h;
    var noq = document.querySelectorAll('.noq'); if (innerWidth > 640) [].forEach.call(noq, function (n) { n.remove(); });
    if (document.getElementById('pad')) pad(v);
  }

  function pad(v) {
    var cv = document.getElementById('pad'), ctx = cv.getContext('2d'), drawn = false, down = false, last = null;
    function size() { var r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#171613'; drawn = false; document.getElementById('ph').style.display = ''; }
    size(); addEventListener('resize', function () { if (!drawn) size(); });
    function pt(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    cv.addEventListener('pointerdown', function (e) { down = true; last = pt(e); cv.setPointerCapture(e.pointerId); document.getElementById('ph').style.display = 'none'; });
    cv.addEventListener('pointermove', function (e) { if (!down) return; var p = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; drawn = true; });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { cv.addEventListener(t, function () { down = false; }); });
    document.getElementById('clr').addEventListener('click', size);
    document.getElementById('go').addEventListener('click', function () {
      var err = document.getElementById('err'), nom = document.getElementById('sn').value.trim(), ok = document.getElementById('ok').checked;
      err.textContent = '';
      if (nom.length < 3) { err.textContent = 'Indiquez le nom du signataire.'; return; }
      if (!drawn) { err.textContent = 'Tracez votre signature dans le cadre.'; return; }
      if (!ok) { err.textContent = 'Cochez « Bon pour accord » pour valider.'; return; }
      // Signature réduite (PNG léger) avant envoi.
      var out = document.createElement('canvas'), w = 480, hgt = Math.round(w * cv.height / cv.width); out.width = w; out.height = hgt;
      out.getContext('2d').drawImage(cv, 0, 0, w, hgt);
      var b = this; b.disabled = true; b.textContent = 'Signature en cours…';
      fetch('/api/devis', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'sign', id: id, nom: nom, signature: out.toDataURL('image/png'), accept: true }) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw j; return j; }); })
        .then(function (j) { render(j.devis); scrollTo({ top: 0, behavior: 'smooth' }); if (window.gtag) gtag('event', 'devis_signe'); })
        .catch(function (j) { b.disabled = false; b.textContent = 'Signer le devis'; err.textContent = (j && j.message) || (j && j.error === 'deja_signe' ? 'Ce devis est déjà signé.' : 'La signature n’a pas abouti. Réessayez ou appelez le 07 82 29 85 59.'); });
    });
  }
})();
</script>
</body>
</html>
