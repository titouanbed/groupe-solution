<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#ffffff" />
<title>Tableau de bord | Groupe Solution</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
<style>
:root{--ink:#171613;--sec:#57534B;--muted:#8A857B;--line:#EBE8E1;--bg:#FAF9F6;--acc:#E61E4D;--acc2:#FF6B5B;--ok:#1F7A4C;--warn:#B7791F;--blue:#3A4DB0;--sh:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);--sh2:0 2px 4px rgba(0,0,0,.05),0 14px 34px rgba(0,0,0,.10);--sans:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Source Serif 4",Georgia,serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
a{color:inherit}button{font-family:inherit}
/* En-tête façon « barre de recherche » */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.topIn{max-width:1180px;margin:0 auto;padding:14px 18px 0;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;text-decoration:none}.logo img{height:28px}
.search{justify-self:center;width:min(640px,100%);display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;background:#fff;box-shadow:var(--sh);padding:6px 6px 6px 20px;transition:box-shadow .2s}
.search:focus-within{box-shadow:var(--sh2)}.search input{flex:1;border:0;outline:0;font:500 15px var(--sans);background:transparent;min-width:0;padding:8px 0}.search .go{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.me{display:flex;align-items:center;gap:8px}.me a,.me button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:700 13.5px var(--sans);cursor:pointer;text-decoration:none;color:var(--ink)}
.cats{max-width:1180px;margin:0 auto;padding:10px 18px 0;display:flex;gap:30px;overflow-x:auto;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px 12px;border:0;background:none;cursor:pointer;color:var(--muted);font:600 12.5px var(--sans);border-bottom:2px solid transparent;position:relative;transition:color .15s}
.cat svg{width:24px;height:24px}.cat:hover{color:var(--ink)}.cat.on{color:var(--ink);border-bottom-color:var(--ink)}.cat i{position:absolute;top:2px;right:-10px;background:var(--acc);color:#fff;font:800 11px var(--sans);font-style:normal;border-radius:999px;padding:1px 6px}
main{max-width:1180px;margin:0 auto;padding:22px 18px 90px}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}.hello h1{font:600 clamp(26px,3.4vw,36px)/1.15 var(--serif);margin:0;letter-spacing:-.02em}.hello p{margin:4px 0 0;color:var(--sec)}.hello small{color:var(--muted);font-weight:600}
/* Chiffres clés */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left}.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.kpi .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px}.kpi .ic svg{width:18px;height:18px}
.kpi b{display:block;font:600 32px/1 var(--serif);letter-spacing:-.02em}.kpi span{display:block;margin-top:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.c1 .ic{background:#EEF1FB;color:var(--blue)}.c2 .ic{background:#E8F5EE;color:var(--ok)}.c3 .ic{background:#FDECEF;color:var(--acc)}.c4 .ic{background:#FFF4E0;color:var(--warn)}.c5 .ic{background:#F2EEFB;color:#6B4FB8}
/* Grille principale */
.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:22px;align-items:start}
h2{font:600 22px/1.2 var(--serif);margin:0 0 12px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}h2 small{font:600 13px var(--sans);color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:start}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--sans);color:#fff;flex-shrink:0}
.t{font-weight:800;font-size:15px;line-height:1.3}.s{color:var(--sec);font-size:13.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.m{color:var(--muted);font-size:12.5px;margin-top:4px}
.pill{font:800 10.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;white-space:nowrap}.p-dem{background:#FDECEF;color:var(--acc)}.p-con{background:#EEF1FB;color:var(--blue)}.p-rad{background:#FFF4E0;color:var(--warn)}.p-ok{background:#E8F5EE;color:var(--ok)}.p-nl{background:#F2EEFB;color:#6B4FB8}.p-lead{background:#E8F5EE;color:var(--ok)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0 56px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;border:1px solid var(--line);border-radius:999px;padding:0 14px;background:#fff;color:var(--ink);font:700 13px var(--sans);text-decoration:none;cursor:pointer;transition:border-color .15s,background .15s}.btn:hover{border-color:var(--ink)}
.btn.p{background:var(--ink);border-color:var(--ink);color:#fff}.btn.a{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}.btn svg{width:15px;height:15px}.btn:disabled{opacity:.5}
details.more{margin:10px 0 0 56px}details.more summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--sec)}
.tr{display:flex;flex-direction:column;gap:8px;margin:12px 0 0 56px}.tr .mu,.tr .ma{max-width:90%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap}.tr .mu{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:5px}.tr .ma{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:5px}
pre.mail{white-space:pre-wrap;font:14px/1.55 var(--sans);background:var(--bg);border-radius:12px;padding:12px;margin:8px 0}
.empty{text-align:center;color:var(--muted);padding:26px 16px}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* Graphique */
.chart{position:relative;height:150px;display:flex;align-items:flex-end;gap:2px;padding:6px 0 22px;border-bottom:1px solid var(--line)}
.bar{flex:1;display:flex;align-items:flex-end;height:100%;position:relative;cursor:default}.bar i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px;opacity:.9;transition:opacity .15s}.bar:hover i{opacity:1}.bar.zero i{background:#E9E6DF}
.bar em{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font:600 10.5px var(--sans);color:var(--muted);font-style:normal;white-space:nowrap}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font:600 12.5px var(--sans);padding:6px 9px;border-radius:8px;transform:translate(-50%,-110%);white-space:nowrap;display:none;z-index:3}
.feed .it{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}.feed .it:last-child{border:0}.feed .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}.feed small{display:block;color:var(--muted);font-size:12px}
.health .row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.health .row:last-child{border:0}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px}.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}.st.ko::before{background:var(--acc)}.st.wa::before{background:var(--warn)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:700 13px var(--sans);cursor:pointer}.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
label{display:block;font-size:12.5px;font-weight:700;color:var(--sec);margin:10px 0 4px}input.f{width:100%;font:15px var(--sans);padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.login{max-width:420px;margin:14vh auto 0;padding:0 18px;text-align:center}.login h1{font:600 30px var(--serif);margin:16px 0 6px}.login p{color:var(--sec)}.login input{width:100%;font:16px var(--sans);padding:14px 16px;border:1px solid var(--line);border-radius:14px;margin-top:10px}.login .btn{width:100%;justify-content:center;min-height:50px;margin-top:10px;font-size:15px}.err{color:var(--acc);font-weight:700;font-size:14px;margin-top:10px}
@media(max-width:980px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.topIn{grid-template-columns:1fr auto;padding-top:10px}.logo span{display:none}.search{grid-column:1/-1;grid-row:2;justify-self:stretch}.kpis{grid-template-columns:repeat(2,1fr)}.kpis .kpi:first-child{grid-column:1/-1}.cats{gap:22px}.acts,.tr,details.more{margin-left:0}.item{grid-template-columns:38px 1fr}.item .pill{grid-column:2;justify-self:start;margin-top:4px}.av{width:38px;height:38px;font-size:13.5px}}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <img src="/Logo.svg" alt="Groupe Solution" height="34" />
  <h1>Tableau de bord</h1>
  <p>Votre code d’accès (variable ADMIN_TOKEN dans Vercel). Mémorisé 30 jours sur cet appareil.</p>
  <input type="password" id="tok" autocomplete="current-password" placeholder="Code d’accès" />
  <button class="btn a" id="in">Entrer</button>
  <p class="err" id="lerr"></p>
</div>
<div id="app" hidden>
  <div class="top">
    <div class="topIn">
      <a class="logo" href="/"><img src="/Logo.svg" alt="Groupe Solution" /></a>
      <label class="search"><input id="q" type="search" placeholder="Rechercher un contact, une entreprise, un e-mail, un mot…" autocomplete="off" /><span class="go" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></span></label>
      <div class="me"><button id="refresh" title="Actualiser">Actualiser</button><button id="out">Quitter</button></div>
    </div>
    <nav class="cats" id="cats"></nav>
  </div>
  <main id="view"></main>
</div>
<script>
(function () {
  var TK = 'gs-admin-token', token = '', D = null, TAB = 'home', Q = '';
  // Code mémorisé 30 jours sur l'appareil, puis redemandé.
  try { var saved = JSON.parse(localStorage.getItem(TK) || 'null'); if (saved && saved.t && Date.now() - saved.d < 30 * 864e5) token = saved.t; else if (typeof saved === 'string') token = saved; } catch (e) { try { token = localStorage.getItem(TK) || ''; } catch (e2) {} }
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ago(d) { if (!d) return ''; var m = Math.round((Date.now() - new Date(d)) / 60000); return m < 1 ? 'à l’instant' : m < 60 ? 'il y a ' + m + ' min' : m < 1440 ? 'il y a ' + Math.round(m / 60) + ' h' : m < 10080 ? 'il y a ' + Math.round(m / 1440) + ' j' : new Date(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }); }
  var P = function (d) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>'; };
  var IC = {
    home: P('<path d="M4 11 12 4l8 7v9h-5.5v-5.5h-5V20H4z"/>'), contacts: P('<circle cx="9" cy="8.5" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M15.5 5.5a3.2 3.2 0 0 1 0 6.2M17.5 14.2A5.5 5.5 0 0 1 20.5 19"/>'),
    convs: P('<path d="M4 5.5h16v11H9l-4 3.5v-3.5H4z"/><path d="M8 10h8M8 13h5"/>'), dem: P('<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 15.5h5"/>'),
    radar: P('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>'), nl: P('<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4 7 8 6 8-6"/>'),
    sante: P('<path d="M12 20s-7.5-4.5-7.5-10A4.3 4.3 0 0 1 12 7.3 4.3 4.3 0 0 1 19.5 10c0 5.5-7.5 10-7.5 10z"/><path d="M8.5 12h2l1-2 1.5 4 1-2h1.5"/>'),
    tel: P('<path d="M6.5 3.5h3l1.5 4.5-2 1.3a11 11 0 0 0 5.7 5.7l1.3-2 4.5 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.5 5.7a2 2 0 0 1 2-2.2z"/>'), mail: P('<rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4 7 8 6 8-6"/>'),
    ok: P('<path d="m5 12.5 4.5 4.5L19 7.5"/>'), eye: P('<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>')
  };
  var COLORS = ['#E61E4D', '#3A4DB0', '#1F7A4C', '#B7791F', '#6B4FB8', '#0E7490', '#9D174D', '#57534B'];
  function avatar(name) { var n = String(name || '?').trim(), h = 0; for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0; var ini = n.replace(/[^A-Za-zÀ-ÿ0-9 ]/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase() || '·'; return '<span class="av" style="background:' + COLORS[h % COLORS.length] + '">' + esc(ini) + '</span>'; }
  function api(q, body) {
    return fetch('/api/devis' + (q || ''), { method: body ? 'POST' : 'GET', headers: { 'X-Admin': encodeURIComponent(token), 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 401) { showLogin(j.adminConfigured === false ? 'L’espace n’est pas encore activé : ajoutez ADMIN_TOKEN dans Vercel puis redéployez (Deployments → ⋯ → Redeploy).' : token ? 'Code incorrect. Vérifiez les majuscules et les caractères spéciaux.' : ''); throw 0; }
        if (r.status === 503) { showLogin('La base de données (Upstash) n’est pas connectée au projet Vercel.'); throw 0; }
        if (!r.ok) throw j; return j; }); });
  }
  function showLogin(msg) { $('#app').hidden = true; $('#login').hidden = false; $('#lerr').textContent = msg || ''; setTimeout(function () { $('#tok').focus(); }, 50); }
  $('#in').onclick = function () { token = $('#tok').value.trim(); try { localStorage.setItem(TK, JSON.stringify({ t: token, d: Date.now() })); } catch (e) {} load(); };
  $('#tok').onkeydown = function (e) { if (e.key === 'Enter') $('#in').click(); };
  $('#out').onclick = function () { try { localStorage.removeItem(TK); } catch (e) {} token = ''; D = null; showLogin(); };
  $('#refresh').onclick = function () { load(); };
  $('#q').oninput = function () { Q = this.value.trim().toLowerCase(); if (Q) search(); else show(TAB); };

  function load() {
    if (!token) return showLogin();
    api('?admin=dashboard').then(function (d) { D = d; $('#login').hidden = true; $('#app').hidden = false; cats(); Q ? search() : show(TAB); }).catch(function () {});
  }
  /* ── Données dérivées ── */
  function leadsOpen() { return (D.leads || []).filter(function (l) { return l.statut !== 'traite'; }); }
  function todo() {
    var dem = D.demandes.filter(function (x) { return x.statut !== 'traite'; }), seen = {};
    dem.forEach(function (x) { if (x.sid) seen[x.sid] = 1; });
    var leads = leadsOpen().filter(function (l) { if (l.sid && seen[l.sid]) return false; if (l.sid) seen[l.sid] = 1; return true; });
    var conv = D.convs.filter(function (c) { return c.statut !== 'traite' && !seen[c.sid] && c.contact && (c.contact.telephone || c.contact.email); });
    var rad = D.radar.filter(function (x) { return x.statut === 'nouveau'; });
    var nlp = (D.nl || []).filter(function (x) { return !x.ok && x.envoi === 'echec'; });
    return { dem: dem, leads: leads, conv: conv, rad: rad, nlp: nlp, n: dem.length + leads.length + conv.length + rad.length + nlp.length };
  }
  function cats() {
    var t = todo(), sante = D.sante || {}, sk = (!sante.mail || !sante.ia || (sante.erreurs && sante.erreurs.length && new Date() - new Date(sante.erreurs[0].date) < 2 * 864e5)) ? 1 : 0;
    var list = [['home', 'Aujourd’hui', t.n], ['contacts', 'Contacts', t.leads.length + t.conv.length], ['convs', 'Conversations', 0], ['dem', 'Devis', t.dem.length], ['radar', 'Radar', t.rad.length], ['nl', 'Newsletter', t.nlp.length], ['sante', 'Santé', sk]];
    $('#cats').innerHTML = list.map(function (c) { return '<button class="cat' + (c[0] === TAB && !Q ? ' on' : '') + '" data-t="' + c[0] + '">' + IC[c[0]] + c[1] + (c[2] ? '<i>' + c[2] + '</i>' : '') + '</button>'; }).join('');
    [].forEach.call(document.querySelectorAll('.cat'), function (b) { b.onclick = function () { $('#q').value = ''; Q = ''; show(b.getAttribute('data-t')); }; });
  }
  function show(t) { TAB = t; cats(); ({ home: home, contacts: contacts, convs: convs, dem: dems, radar: radar, nl: nl, sante: sante })[t](); scrollTo(0, 0); }
  var week = function (d) { return d && Date.now() - new Date(d) < 7 * 864e5; };
  function contactBtns(c, subject) { c = c || {}; var h = ''; if (c.telephone) h += '<a class="btn a" href="tel:' + esc(String(c.telephone).replace(/\s/g, '')) + '">' + IC.tel + esc(c.telephone) + '</a>'; if (c.email) h += '<a class="btn" href="mailto:' + encodeURIComponent(c.email) + (subject ? '?subject=' + encodeURIComponent(subject) : '') + '">' + IC.mail + esc(c.email) + '</a>'; return h; }

  /* ── Cartes ── */
  function demCard(x) {
    return '<div class="card"><div class="item">' + avatar(x.contact.nom || x.contact.entreprise) + '<div><div class="t">' + esc(x.contact.nom || 'Visiteur') + (x.contact.entreprise ? ' · ' + esc(x.contact.entreprise) : '') + '</div><div class="s">' + esc(x.titre) + '</div><div class="m">' + ago(x.date) + ' · budget ' + esc(x.budget) + ' · ' + esc(x.delai) + ' · ≈ ' + x.jours + ' j de travail</div></div><span class="pill ' + (x.statut === 'traite' ? 'p-ok' : 'p-dem') + '">' + (x.statut === 'traite' ? 'Devis envoyé' : 'Devis à faire') + '</span></div>' +
      '<details class="more"><summary>Ce qu’il a retenu</summary><p class="s" style="-webkit-line-clamp:unset">' + esc(x.resume) + '</p><ul>' + x.choisies.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></details>' +
      '<div class="acts">' + contactBtns(x.contact, 'Votre devis — ' + x.titre) + (x.sid ? '<button class="btn" data-open="' + x.sid + '">' + IC.eye + 'Conversation</button>' : '') + (x.statut !== 'traite' ? '<button class="btn p" data-done="demande:' + x.id + '">' + IC.ok + 'Devis envoyé</button>' : '') + '</div>' + (x.sid ? '<div id="cv' + x.sid + '"></div>' : '') + '</div>';
  }
  function leadCard(l) {
    var ch = l.champs || {}, msg = ch.message || ch.besoin || ch.topic || ch.conversation || '';
    return '<div class="card"><div class="item">' + avatar(l.nom) + '<div><div class="t">' + esc(l.nom || 'Visiteur') + '</div><div class="s">' + esc(msg ? msg.slice(0, 180) : 'Demande de rappel') + '</div><div class="m">' + ago(l.date) + ' · ' + esc(ch.source || ch.page || 'formulaire') + (l.mail === 'echec' ? ' · <b style="color:var(--acc)">e-mail non parti, gardé ici</b>' : '') + '</div></div><span class="pill ' + (l.statut === 'traite' ? 'p-ok' : 'p-lead') + '">' + (l.statut === 'traite' ? 'Traité' : 'À rappeler') + '</span></div>' +

  function chart() {
