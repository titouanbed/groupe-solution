<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="referrer" content="no-referrer" />
<title>Demandes de devis | Groupe Solution</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
:root{--ink:#171613;--sec:#57534B;--muted:#8A857B;--line:#E7E4DC;--paper:#F7F6F3;--acc:#E61E4D;--ok:#2F7D4F}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}header b{font-size:18px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}nav button{flex-shrink:0;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer}nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.row small{color:var(--muted)}
.tag{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:999px;background:#eee}.tag.nouveau,.tag.envoye{background:#FDECEF;color:var(--acc)}.tag.signe{background:#E7F3EC;color:var(--ok)}
label{display:block;font-size:12.5px;font-weight:700;color:var(--sec);margin:10px 0 4px}
input,textarea,select{width:100%;font:15px inherit;font-family:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}textarea{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.g4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:0 10px}
.line{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:#FCFBF8}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff;font-size:14.5px}.btn.acc{background:var(--acc)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:7px 12px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tot{text-align:right;font-weight:800;font-size:17px;margin-top:8px}
.note{font-size:13px;color:var(--muted)}.err{color:var(--acc);font-weight:700}
.brief ul,.brief ol{margin:4px 0 8px 1.1em;padding:0}
a{color:var(--acc)}
@media(max-width:640px){.g2,.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header><b>Demandes de devis</b><span><a href="/">Site</a> · <a href="#" id="out">Déconnexion</a></span></header>
  <div id="login" class="card" hidden>
    <p><b>Connexion</b></p>
    <p class="note">Saisissez le code d’accès défini dans Vercel (variable <code>ADMIN_TOKEN</code>, 16 caractères minimum). Il reste sur cet appareil.</p>
    <input type="password" id="tok" autocomplete="current-password" placeholder="Code d’accès" />
    <div class="bar"><button class="btn" id="in">Se connecter</button></div><p class="err" id="lerr"></p>
  </div>
  <div id="main" hidden>
    <nav><button data-t="demandes" class="on">Demandes</button><button data-t="settings">Ma grille privée</button></nav>
    <div id="view"></div>
  </div>
</div>
<script>
(function () {
  var TK = 'gs-admin-token', token = '';
  try { token = localStorage.getItem(TK) || ''; } catch (e) {}
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function eur(n) { return Math.round(n || 0).toLocaleString('fr-FR') + ' €'; }
  function api(q, body) {
    return fetch('/api/devis' + (q || ''), { method: body ? 'POST' : 'GET', headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (r.status === 401) { showLogin(j.adminConfigured === false ? 'ADMIN_TOKEN n’est pas encore défini dans Vercel (16 caractères minimum).' : 'Code incorrect.'); throw 0; } if (!r.ok) throw j; return j; }); });
  }
  function showLogin(msg) { $('#main').hidden = true; $('#login').hidden = false; $('#lerr').textContent = msg || ''; }
  $('#in').onclick = function () { token = $('#tok').value.trim(); try { localStorage.setItem(TK, token); } catch (e) {} boot(); };
  $('#out').onclick = function (e) { e.preventDefault(); try { localStorage.removeItem(TK); } catch (e2) {} token = ''; showLogin(); };
  [].forEach.call(document.querySelectorAll('nav button'), function (b) { b.onclick = function () { tab(b.getAttribute('data-t')); }; });
  var G = {}, MAIL = false;
  function tab(t) { [].forEach.call(document.querySelectorAll('nav button'), function (b) { b.classList.toggle('on', b.getAttribute('data-t') === t); }); t === 'settings' ? settings() : list(); }
  function boot() {
    if (!token) return showLogin();
    api('?admin=settings').then(function (j) {
      G = j.grille || {}; MAIL = j.mail; $('#login').hidden = true; $('#main').hidden = false;
      var m = location.hash.match(/demande=([a-f0-9]{32})/); list(m && m[1]);
      if (!G.tjm) $('#view').insertAdjacentHTML('afterbegin', '<div class="card"><b>À régler une fois :</b> votre taux journalier dans « Ma grille privée ». Il sert à calculer, sans jamais l’afficher au visiteur, la jauge « ce qui tient dans votre budget ».</div>');
    }).catch(function () {});
  }
  function list(open) {
    $('#view').innerHTML = '<p class="note">Chargement…</p>';
    api('?admin=list').then(function (j) {
      $('#view').innerHTML = j.demandes.length ? j.demandes.map(function (d) { return '<div class="card"><div class="row"><div><b>' + esc(d.titre) + '</b><br><small>' + esc([d.contact.nom, d.contact.entreprise, d.contact.telephone, d.contact.email].filter(Boolean).join(' · ')) + '<br>' + new Date(d.date).toLocaleString('fr-FR') + ' · budget ' + esc(d.budget) + ' · ' + esc(d.delai) + '</small></div><span class="tag nouveau">' + (d.total ? eur(d.total) : '—') + (d.part != null ? ' · ' + d.part + ' %' : '') + '</span></div><div class="bar"><button class="btn sm ghost" data-v="' + d.id + '">Détail</button>' + (d.contact.telephone ? '<a class="btn sm acc" href="tel:' + esc(d.contact.telephone.replace(/\s/g, '')) + '">Appeler</a>' : '') + (d.contact.email ? '<a class="btn sm ghost" href="mailto:' + esc(d.contact.email) + '">E-mail</a>' : '') + '</div><div class="brief" id="d' + d.id + '"></div></div>'; }).join('') : '<div class="card">Aucune demande pour l’instant. Elles arrivent ici (et par e-mail) quand un visiteur prépare son devis dans le chat de l’accueil.</div>';
      [].forEach.call(document.querySelectorAll('[data-v]'), function (x) { x.onclick = function () { detail(x.getAttribute('data-v')); }; });
      if (open) detail(open);
    }).catch(function () {});
  }
  function detail(id) {
    api('?admin=demande&id=' + id).then(function (r) {
      var d = r.demande, box = $('#d' + id); if (!d || !box) return;
      function li(a) { return a.map(function (x) { return '<li><b>' + esc(x.titre) + '</b> <small>(' + esc(x.niveau) + (x.recurrent ? ', mensuel' : '') + ' · ' + x.jours + ' j' + (x.cout ? ' · ' + eur(x.cout) : '') + ')</small><br>' + esc(x.detail) + '</li>'; }).join(''); }
      box.innerHTML = '<p>' + esc(d.resume) + '</p>' + (d.message ? '<p><b>Message :</b> ' + esc(d.message) + '</p>' : '') + '<p><b>Estimation interne :</b> ' + d.estimation.jours + ' j' + (d.estimation.choisi ? ' ≈ ' + eur(d.estimation.choisi) : '') + (d.estimation.part != null ? ' (' + d.estimation.part + ' % de son budget)' : '') + '</p><b>Retenu</b><ul>' + li(d.choisies) + '</ul>' + (d.ecartees.length ? '<b>Écarté</b><ul>' + li(d.ecartees) + '</ul>' : '') + '<b>À préciser</b><ul>' + d.questions.map(function (q) { return '<li>' + esc(q) + '</li>'; }).join('') + '</ul><details><summary>Conversation</summary><pre style="white-space:pre-wrap;font-size:12px">' + esc(d.conversation) + '\n' + esc(d.besoin) + '</pre></details>';
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }).catch(function () {});
  }
  function settings() {
    $('#view').innerHTML = '<div class="card"><b>Ma grille privée</b><p class="note">Jamais affichée aux visiteurs. L’IA estime les jours de travail de chaque brique (en tenant compte du fait que vous allez vite grâce à l’IA) ; votre taux journalier les transforme en une part de <i>leur</i> budget, affichée comme une jauge — sans aucun montant. E-mails : ' + (MAIL ? 'Brevo configuré ✅' : 'Brevo non configuré ⚠️') + '</p>' +
      '<label>Taux journalier moyen (€ HT)</label><input id="g_tjm" type="number" value="' + esc(G.tjm || '') + '">' +
      '<label>Montant minimum d’un projet (€ HT, facultatif)</label><input id="g_min" type="number" value="' + esc(G.minimum || '') + '">' +
      '<label class="row" style="justify-content:flex-start;gap:8px"><input id="g_j" type="checkbox" style="width:auto"' + (G.jauge !== false ? ' checked' : '') + '> Afficher la jauge budget aux visiteurs</label>' +
      '<label>Note pour vous</label><textarea id="g_note">' + esc(G.note || '') + '</textarea>' +
      '<div class="bar"><button class="btn" id="gs">Enregistrer</button></div><p class="note" id="gm"></p></div>';
    $('#gs').onclick = function () { api('', { action: 'settings', grille: { tjm: $('#g_tjm').value, minimum: $('#g_min').value, jauge: $('#g_j').checked, note: $('#g_note').value } }).then(function (r) { G = r.grille; $('#gm').textContent = 'Enregistré ✅'; }).catch(function () { $('#gm').textContent = 'Erreur'; }); };
  }
  boot();
})();
</script>
</body>
</html>
