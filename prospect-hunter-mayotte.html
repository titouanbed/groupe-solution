<style>
:root {
  --bg: #0a0a0b;
  --surface: #131316;
  --surface-2: #1c1c21;
  --border: #2a2a30;
  --pink: #EC4899;
  --pink-soft: #F9A8D4;
  --pink-dim: rgba(236,72,153,0.12);
  --text: #f4f4f5;
  --text-dim: #a1a1aa;
  --text-faint: #71717a;
  --green: #22c55e;
  --amber: #f59e0b;
  --radius: 14px;
  font-family: Inter, system-ui, -apple-system, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* HEADER */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,11,0.85); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
.brand-mark { width: 28px; height: 28px; background: linear-gradient(135deg, var(--pink), var(--pink-soft)); border-radius: 8px; position: relative; }
.brand-mark::after { content: ''; position: absolute; inset: 5px; background: var(--bg); border-radius: 4px; }
.stats-row { display: flex; gap: 10px; flex-wrap: wrap; }
.stat-pill {
  background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
  padding: 6px 14px; font-size: 12px; color: var(--text-dim); white-space: nowrap;
}
.stat-pill b { color: var(--pink-soft); font-size: 14px; }

/* FILTERS */
.filters {
  padding: 14px 20px; display: flex; gap: 8px; flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.filter-btn {
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 20px; padding: 7px 14px; font-size: 13px; cursor: pointer;
  transition: all 0.2s; font-family: inherit;
}
.filter-btn:hover { border-color: var(--pink); color: var(--text); }
.filter-btn.active { background: var(--pink-dim); border-color: var(--pink); color: var(--pink-soft); }
.filter-btn .count { font-size: 11px; opacity: 0.6; margin-left: 4px; }

/* MAIN */
.main { max-width: 1100px; margin: 0 auto; padding: 20px; }

/* PROSPECT CARD */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  margin-bottom: 14px; overflow: hidden; transition: border-color 0.2s;
}
.card:hover { border-color: rgba(236,72,153,0.3); }
.card-head {
  padding: 16px 18px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; cursor: pointer;
}
.card-info { flex: 1; min-width: 0; }
.card-name { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
.card-meta { display: flex; gap: 8px; flex-wrap: wrap; }
.tag {
  font-size: 11px; padding: 3px 9px; border-radius: 10px; font-weight: 600;
  background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border);
}
.tag.sector { background: var(--pink-dim); color: var(--pink-soft); border-color: rgba(236,72,153,0.2); }
.tag.has-fb { color: #1877f2; border-color: rgba(24,119,242,0.3); }
.tag.has-ig { color: #c13584; border-color: rgba(193,53,132,0.3); }
.tag.has-wa { color: var(--green); border-color: rgba(34,197,94,0.3); }
.card-city { font-size: 13px; color: var(--text-faint); margin-top: 2px; }
.card-arrow { color: var(--text-faint); font-size: 20px; transition: transform 0.2s; }
.card.open .card-arrow { transform: rotate(180deg); }

/* EXPANDED BODY */
.card-body {
  max-height: 0; overflow: hidden; transition: max-height 0.3s ease;
}
.card.open .card-body { max-height: 900px; }
.card-inner { padding: 0 18px 18px; }

/* MESSAGE PREVIEW */
.msg-preview {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 16px; font-size: 14px; line-height: 1.6; color: var(--text-dim);
  margin-bottom: 14px; white-space: pre-wrap; position: relative;
}
.msg-preview .copy-btn {
  position: absolute; top: 10px; right: 10px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; font-family: inherit;
  transition: all 0.2s;
}
.msg-preview .copy-btn:hover { color: var(--pink); border-color: var(--pink); }
.msg-preview .copy-btn.copied { color: var(--green); border-color: var(--green); }

/* ACTION BUTTONS */
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.action-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 11px 18px; border-radius: 10px; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.15s; text-decoration: none; border: 1px solid;
  font-family: inherit;
}
.action-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.action-btn .lbl { white-space: nowrap; }

.btn-fb { background: #1877f2; color: #fff; border-color: #1877f2; }
.btn-fb:hover { background: #1661d0; }
.btn-wa { background: var(--green); color: #fff; border-color: var(--green); }
.btn-wa:hover { background: #16a34a; }
.btn-call { background: var(--surface-2); color: var(--text); border-color: var(--border); }
.btn-call:hover { border-color: var(--pink); }
.btn-sms { background: var(--surface-2); color: var(--text); border-color: var(--border); }
.btn-sms:hover { border-color: var(--pink); }
.btn-ig { background: linear-gradient(135deg, #833ab4, #c13584, #fd1d1d); color: #fff; border-color: transparent; }
.btn-ig:hover { opacity: 0.9; }

/* STATUS BADGE */
.status-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 8px;
}
.status-badge .dot { width: 8px; height: 8px; border-radius: 50%; }
.status-todo { background: rgba(113,113,122,0.15); color: var(--text-faint); }
.status-todo .dot { background: var(--text-faint); }
.status-done { background: rgba(34,197,94,0.15); color: var(--green); }
.status-done .dot { background: var(--green); }
.status-skip { background: rgba(245,158,11,0.15); color: var(--amber); }
.status-skip .dot { background: var(--amber); }

.status-controls { display: flex; gap: 6px; margin-top: 12px; }
.status-btn {
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
  transition: all 0.2s;
}
.status-btn:hover { border-color: var(--pink); color: var(--text); }

/* EMPTY */
.empty { text-align: center; padding: 60px 20px; color: var(--text-faint); }
.empty svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.3; }

/* SEARCH */
.search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 300px; }
.search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-faint); }
.search-input {
  width: 100%; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 20px; padding: 8px 14px 8px 36px; color: var(--text); font-size: 13px;
  font-family: inherit; outline: none; transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--pink); }
.search-input::placeholder { color: var(--text-faint); }

/* RESPONSIVE */
@media (max-width: 640px) {
  .topbar { padding: 12px 14px; }
  .stats-row { gap: 6px; }
  .stat-pill { padding: 5px 10px; font-size: 11px; }
  .main { padding: 14px; }
  .card-head { padding: 14px; }
  .card-inner { padding: 0 14px 14px; }
  .action-btn { padding: 10px 14px; font-size: 13px; }
  .action-btn .lbl { display: none; }
}
</style>

let activeFilter = "all";
let searchQuery = "";
const status = {};

try {
  const saved = JSON.parse(localStorage.getItem("prospect-status") || "{}");
  Object.assign(status, saved);
} catch(e) {}

function saveStatus() {
  try { localStorage.setItem("prospect-status", JSON.stringify(status)); } catch(e) {}
}

function phoneToWhatsApp(phone) {
  let p = phone.replace(/\s/g, "").replace(/\./g, "");
  if (p.startsWith("0269")) return "26269" + p.slice(4);
  if (p.startsWith("0639")) return "262639" + p.slice(4);
  if (p.startsWith("06")) return "2626" + p.slice(2);
  if (p.startsWith("0")) return "262" + p.slice(1);
  return p;
}

function phoneToIntl(phone) {
  let p = phone.replace(/\s/g, "").replace(/\./g, "");
  if (p.startsWith("0269")) return "26269" + p.slice(4);
  if (p.startsWith("0639")) return "262639" + p.slice(4);
  if (p.startsWith("06")) return "2626" + p.slice(2);
  if (p.startsWith("0")) return "262" + p.slice(1);
  return p;
}

function fbMessengerUrl(fbUrl) {
  const m = fbUrl.match(/facebook\.com\/([^\/\?]+)/);
  if (m) {
    let name = m[1].replace(/^p\//, "");
    if (name.startsWith("1000")) return "https://www.facebook.com/" + name + "/messenger";
    return "https://m.me/" + name;
  }
  return fbUrl;
}

const sectors = ["all", ...new Set(prospects.map(p => p.sector))];
const filterEl = document.getElementById("filters");
const listEl = document.getElementById("list");
const searchEl = document.getElementById("search");

function renderFilters() {
  filterEl.innerHTML = sectors.map(s => {
    const count = s === "all" ? prospects.length : prospects.filter(p => p.sector === s).length;
    const label = s === "all" ? "Tous" : s;
    const active = s === activeFilter ? "active" : "";
    return '<button class="filter-btn ' + active + '" data-sector="' + s + '">' + label + '<span class="count">' + count + '</span></button>';
  }).join("");
  filterEl.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      activeFilter = btn.dataset.sector;
      renderFilters();
      renderList();
    });
  });
}

function getFiltered() {
  return prospects.filter(p => {
    if (activeFilter !== "all" && p.sector !== activeFilter) return false;
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      return p.name.toLowerCase().includes(q) || p.city.toLowerCase().includes(q) || p.sector.toLowerCase().includes(q);
    }
    return true;
  });
}

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderList() {
  const filtered = getFiltered();
  const done = Object.values(status).filter(v => v === "done").length;
  const skip = Object.values(status).filter(v => v === "skip").length;
  const todo = prospects.length - done - skip;
  document.getElementById("stat-total").textContent = prospects.length;
  document.getElementById("stat-done").textContent = done;
  document.getElementById("stat-todo").textContent = todo;
  document.getElementById("stat-skip").textContent = skip;

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><p>Aucun prospect trouve</p></div>';
    return;
  }

  listEl.innerHTML = filtered.map(p => {
    const st = status[p.id] || "todo";
    const stBadge = '<span class="status-badge status-' + st + '"><span class="dot"></span>' + (st === "todo" ? "A contacter" : st === "done" ? "Contacte" : "Skip") + '</span>';

    const tags = [];
    tags.push('<span class="tag sector">' + p.sector + '</span>');
    if (p.facebook) tags.push('<span class="tag has-fb">FB</span>');
    if (p.instagram) tags.push('<span class="tag has-ig">IG</span>');
    if (p.phone) tags.push('<span class="tag has-wa">' + (p.phoneType === "mobile" ? "Mobile" : "Fixe") + '</span>');

    const msg = genMessage(p);
    const waNum = p.phone ? phoneToWhatsApp(p.phone) : null;
    const intlPhone = p.phone ? phoneToIntl(p.phone) : null;

    const actions = [];
    if (p.facebook) {
      actions.push('<a class="action-btn btn-fb" target="_blank" href="' + fbMessengerUrl(p.facebook) + '" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg><span class="lbl">Messenger</span></a>');
    }
    if (waNum) {

    }
    if (intlPhone) {
      actions.push('<a class="action-btn btn-call" target="_blank" href="tel:+' + intlPhone + '" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span class="lbl">Appeler</span></a>');
      actions.push('<a class="action-btn btn-sms" target="_blank" href="sms:+' + intlPhone + '?body=' + encodeURIComponent(msg) + '" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="lbl">SMS</span></a>');
    }
    if (p.instagram) {
      actions.push('<a class="action-btn btn-ig" target="_blank" href="' + p.instagram + '" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg><span class="lbl">Instagram</span></a>');
    }

    const copyId = "msg-" + p.id;
    const addrStr = p.address && p.address !== p.city ? " -- " + p.address : "";

    return '<div class="card' + (st !== "todo" ? " open" : "") + '" data-id="' + p.id + '">' +
      '<div class="card-head" onclick="toggleCard(' + p.id + ')">' +
        '<div class="card-info">' +
          '<div class="card-name">' + p.name + '</div>' +
          '<div class="card-meta">' + tags.join("") + '</div>' +
          '<div class="card-city">' + p.city + addrStr + '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:10px;">' + stBadge + '<span class="card-arrow">\u25BE</span></div>' +
      '</div>' +
      '<div class="card-body"><div class="card-inner">' +
        '<div class="msg-preview" id="' + copyId + '">' + escapeHtml(msg) + '<button class="copy-btn" onclick="copyMsg(\'' + copyId + '\', this)">Copier</button></div>' +
        '<div class="actions">' + actions.join("") + '</div>' +
        '<div class="status-controls">' +
          '<button class="status-btn" onclick="setStatus(' + p.id + ', \'done\', event)">Contacte</button>' +
          '<button class="status-btn" onclick="setStatus(' + p.id + ', \'skip\', event)">Pas interesse</button>' +
          '<button class="status-btn" onclick="setStatus(' + p.id + ', \'todo\', event)">Reinitialiser</button>' +
        '</div>' +
      '</div></div>' +
    '</div>';
  }).join("");
}

function toggleCard(id) {
  const card = document.querySelector('[data-id="' + id + '"]');
  if (card) card.classList.toggle("open");
}

function setStatus(id, val, ev) {
  if (ev) ev.stopPropagation();
  if (val === "todo") delete status[id];
  else status[id] = val;
  saveStatus();
  renderList();
}

function copyMsg(id, btn) {
  const el = document.getElementById(id);
  const text = el.childNodes[0].nodeValue;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = "Copie";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "Copier"; btn.classList.remove("copied"); }, 2000);
  });
}

searchEl.addEventListener("input", (e) => {
  searchQuery = e.target.value;
  renderList();
});

renderFilters();
renderList();
</script>
